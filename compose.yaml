services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: festpass
      POSTGRES_DB: festpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: rishabh0145/fest-backend:1.0.0
    environment:
      REGNO: "202401100100203"
      APP_VERSION: "dev"
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "8083:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net
    depends_on:
      - backend

networks:
  frontend-net:
  backend-net:
    internal: true

volumes:
  postgres-data: